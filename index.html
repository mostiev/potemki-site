<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Потемки — маленький свечной заводик. Свечи ручной работы из оливкового, пчелиного и соевого воска.">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Потемки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap">
<style>
:root{color-scheme:light}
/* Layout: музейный белый лист как у MoMu — бегущая строка с «пламенной» тенью, большой логотип,
   фиксированные кнопки-таблетки справа, черные линии во всю ширину, ячейки с маленькими квадратными фото */
:root{
  --bg:#ffffff; --fg:#000000; --muted:#5f5953; --line:#000000; --soft:#d9d4cf; --tile:#f4f2ef;
  --pill:#ffffff; --pill-fg:#000000;
  --red:#e32118; --orange:#ff7a1c;
  --flame:linear-gradient(90deg,var(--red),var(--orange));
  --sh:8px 10px 37px rgba(0,0,0,.2);
  --sh-hot:8px 10px 37px rgba(227,33,24,.45),-6px 8px 30px rgba(255,122,28,.35);
  --glow:0 0 18px rgba(255,122,28,.55),6px 8px 26px rgba(227,33,24,.35);
  --ok:#2f7d4f;
  --soft-flame:linear-gradient(90deg,rgba(227,33,24,.30),rgba(255,122,28,.34));
  --soft-glow:0 0 12px 2px rgba(255,110,40,.32);
  --sans:"Onest","Gill Sans","Helvetica Neue",Arial,sans-serif;
  --serif:"Spectral","Iowan Old Style",Georgia,"Times New Roman",serif;
  --pl:max(16px,env(safe-area-inset-left,0px));
  --pr:max(16px,env(safe-area-inset-right,0px));
  --mq:46px;
}
@media (min-width:900px){:root{--pl:max(40px,env(safe-area-inset-left,0px));--pr:max(40px,env(safe-area-inset-right,0px));--mq:50px}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:18px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wrap{padding-left:var(--pl);padding-right:var(--pr)}
.bleed{margin-left:calc(var(--pl)*-1);margin-right:calc(var(--pr)*-1)}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}

/* ── бегущая строка ── */
.marquee{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;height:var(--mq);background:var(--bg);display:flex;align-items:center;white-space:nowrap}
.marquee::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 6px);height:16px;background:var(--flame);filter:blur(10px);opacity:.75;z-index:-1;pointer-events:none}
.marquee__clip{overflow:hidden;width:100%;height:100%;display:flex;align-items:center;background:var(--bg)}
.marquee__track{display:inline-flex;gap:100px;padding-left:100px;animation:run 76s linear infinite;font-size:clamp(19px,1.9vw,25px)}
.marquee__track span{background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.marquee:hover .marquee__track{animation-play-state:paused}
@keyframes run{to{transform:translateX(-50%)}}

/* ── шапка ── */
.head{padding-top:30px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;pointer-events:none}
.head .logo{pointer-events:auto}
.logo{display:block;width:clamp(150px,30vw,420px);color:var(--fg);background:none;border:0;padding:0}
.logo svg{display:block;width:100%;height:auto}
.pills{position:fixed;z-index:75;top:calc(env(safe-area-inset-top,0px) + var(--mq) + 22px);right:var(--pr);display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px 2px;border-radius:999px;border:0;background:var(--pill);color:var(--pill-fg);
  box-shadow:var(--sh);font-size:17px;white-space:nowrap;transition:box-shadow .35s,color .35s,background-color .35s}
.pill:hover{box-shadow:var(--sh-hot)}
.pill--hot{color:var(--red);box-shadow:var(--sh-hot)}
.pill--dark{background:var(--fg);color:var(--bg)}
.pill .count{min-width:24px;height:24px;border-radius:12px;color:var(--fg);font-size:13px;display:inline-grid;place-items:center;padding:0 7px;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.hide-sm{display:none!important}
@media (min-width:760px){.hide-sm{display:inline-flex!important}.show-sm{display:none!important}}

/* ── ссылки со светом ── */
.tl{text-decoration:underline;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:.18em;transition:text-decoration-color .3s}
.tl:hover,.tl:focus-visible,.row:hover .tl{text-decoration-color:var(--red)}
.ul .tl,.tl.ul,.tl.ul-fg,.cell__title.tl{text-decoration:none}
.tl.ul-fg:hover{background-image:linear-gradient(var(--red),var(--red));background-size:100% 2px}
.ul{background:linear-gradient(90deg,var(--red),var(--orange)) 0 100%/100% 2px no-repeat;padding-bottom:1px}
.ul-fg{background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;padding-bottom:1px}
.bare{background:none;border:0;padding:0;text-align:inherit}

/* ── раздел ── */
.label{display:flex;align-items:center;gap:10px;font-size:17px;text-transform:uppercase;letter-spacing:.01em;padding-block:20px 18px}
.label::before{content:"";width:15px;height:15px;border-radius:50%;background:currentColor;flex:none}
.label .more{margin-left:auto;text-transform:none}
.line-t{border-top:1px solid var(--line)}
.line-b{border-bottom:1px solid var(--line)}
.muted{color:var(--muted)}
.serif{font-family:var(--serif);font-weight:300}
.display{font-size:clamp(42px,7.6vw,112px);line-height:1;letter-spacing:-.02em}
.h2{font-size:clamp(30px,4.4vw,60px);line-height:1.05;letter-spacing:-.015em}
.h3{font-size:clamp(22px,2.2vw,28px);line-height:1.15}
.small{font-size:15px}
.badge{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px 4px;border-radius:999px;border:1px solid currentColor;vertical-align:middle}
.badge--demo{color:var(--orange)}
.badge--soon{color:var(--fg);border-color:transparent;font-size:13px;padding:4px 12px 5px}
.lit{position:relative;background:var(--bg);border:1.5px solid transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(90deg,var(--red),var(--orange)) border-box;
  animation:lit 2.8s ease-in-out infinite alternate}
@keyframes lit{from{box-shadow:0 0 4px 0 rgba(255,110,40,.18)}to{box-shadow:0 0 14px 3px rgba(255,110,40,.5),4px 6px 18px rgba(227,33,24,.25)}}

/* ── герой-слайдер ── */
.hero{position:relative;display:grid;justify-items:center;text-align:center;padding-bottom:56px;margin-top:0}
.slides{display:grid;width:100%}
.slide{grid-area:1/1;display:grid;justify-items:center;gap:0;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s}
.slide.on{opacity:1;visibility:visible}
.slide__img{width:clamp(210px,24vw,360px);aspect-ratio:3/4;object-fit:cover;max-width:100%;margin-top:28px}
.slide__title{font-family:var(--serif);font-weight:300;font-size:clamp(44px,8vw,120px);line-height:.98;letter-spacing:-.02em;margin-top:28px;max-width:16ch}
.slide__btn{margin-top:-14px;position:relative}
.slide__meta{max-width:44ch;margin-top:22px;font-size:clamp(18px,1.8vw,24px);line-height:1.3}
.counter{position:absolute;right:0;top:28px;line-height:1;display:flex;align-items:center;gap:10px;font-size:clamp(22px,2vw,30px);font-variant-numeric:tabular-nums}
.counter button{font-size:inherit;transition:color .3s,text-shadow .3s}
.dots{display:flex;gap:8px;margin-top:26px}
.dots button{width:9px;height:9px;border-radius:50%;border:1px solid var(--fg);background:transparent;padding:0}
.dots button[aria-current="true"]{background:var(--flame);border-color:transparent}

/* ── свеча месяца ── */
.big{display:block;width:100%;margin-block:40px 8px;border:0;border-radius:999px;background:var(--pill);color:var(--pill-fg);box-shadow:var(--sh);
  font-size:clamp(46px,10.5vw,150px);line-height:1.05;letter-spacing:-.02em;padding:.16em .3em .22em;transition:color .4s,box-shadow .4s}
.big:hover{box-shadow:var(--sh-hot)}
.big small{display:block;font-size:clamp(15px,1.4vw,19px);letter-spacing:0;color:var(--muted);margin-top:4px}

/* ── ячейки (как Other upcoming activities) ── */
.cells{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cells--3{}
@media (min-width:760px){.cells--3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cells--p{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.cells--p{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cell{display:flex;flex-direction:column;min-width:0;padding:18px var(--pr) 0 var(--pl);border-bottom:1px solid var(--line);position:relative}
.cells--p .cell{padding:16px 16px 0}
@media (min-width:760px){
  .cells--3 .cell,.cells--p .cell{padding:18px 26px 0;border-bottom:0;border-right:1px solid var(--line)}
  .cells--3 .cell:nth-child(3n),.cells--p .cell:nth-child(3n){border-right:0}
  .cells--p .cell:nth-child(n+4){border-top:1px solid var(--line)}
  .cells--3 .cell:first-child,.cells--p .cell:nth-child(3n+1){padding-left:var(--pl)}
}
@media (max-width:759px){
  .cells--3 .cell:last-child{border-bottom:0}
  .cells--p .cell:nth-child(odd){border-right:1px solid var(--line);padding-left:var(--pl)}
  .cells--p .cell:nth-child(even){padding-right:var(--pr)}
  .cells--p .cell:nth-last-child(-n+2):nth-child(odd),.cells--p .cell:last-child{border-bottom:0}
}
.cell__title{font-size:clamp(19px,1.7vw,24px);line-height:1.25;align-self:flex-start;text-align:left;background:linear-gradient(var(--fg),var(--fg)) 0 100%/100% 1px no-repeat;padding-bottom:2px}
.cell{transition:color .3s}
.cell:hover{color:var(--red)}
.cell:hover .muted{color:var(--red)}
.cell:hover .cell__media{box-shadow:var(--sh-hot);transform:translateY(-2px)}
.cell:hover .cell__title,.cell__title:focus-visible{background-image:linear-gradient(var(--red),var(--red));background-size:100% 2px}
.cell__meta{font-size:clamp(16px,1.5vw,21px);line-height:1.3}
.cell__media{display:block;width:min(200px,46%);aspect-ratio:1;margin:clamp(48px,7vw,104px) auto clamp(36px,4.5vw,64px);overflow:hidden;background:var(--tile);border:0;padding:0;transition:box-shadow .45s,transform .45s}
.cells--p .cell__media{width:min(190px,62%)}
.cell__media img{width:100%;height:100%;object-fit:cover;display:block}

.cell__buy{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.cell__buy .pill{height:34px;padding:0 14px 2px;font-size:15px}
.price{font-variant-numeric:tabular-nums;white-space:nowrap}
.tagline{position:absolute;right:16px;top:18px}
@media (max-width:759px){.cells--p .tagline{position:static;margin-top:6px}}

/* заглушка без фото */
.ph{width:100%;height:100%;display:grid;place-items:center;position:relative;background:
  radial-gradient(55% 45% at 50% 42%,color-mix(in srgb,var(--orange) 60%,transparent),transparent 72%),
  radial-gradient(26% 22% at 50% 40%,color-mix(in srgb,#fff 75%,var(--orange)),transparent 70%),var(--tile)}
.ph svg{width:46%;color:var(--fg);opacity:.9}

/* ── журнал: черный, как Magazine ── */
.inv{background:var(--fg);color:var(--bg);--line:var(--bg);--muted:color-mix(in srgb,var(--bg) 70%,var(--fg))}
.inv .label{border-bottom:1px solid var(--bg)}
.feature{display:grid;gap:32px;align-items:center;padding-block:48px 72px}
@media (min-width:900px){.feature{grid-template-columns:1fr 1fr;padding-block:64px 96px}}
.feature__img{width:min(300px,70%);aspect-ratio:3/4;object-fit:cover;justify-self:center}
.feature__text{display:grid;gap:16px;justify-items:center;text-align:center;max-width:30ch;justify-self:center}
.feature__title{font-family:var(--serif);font-weight:300;font-size:clamp(32px,3.4vw,46px);line-height:1.1}
.feature__title a,.feature__title button{background:linear-gradient(currentColor,currentColor) 0 92%/100% 1px no-repeat}
.feature__more{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-bottom:40px}
.inv .pill{background:var(--fg);color:var(--bg);border:1px solid var(--bg);box-shadow:8px 10px 37px rgba(255,255,255,.18)}
.inv .pill:hover{box-shadow:8px 10px 37px rgba(255,122,28,.55)}

/* ── о заводике ── */
.stamp{width:min(280px,64%);color:var(--fg);justify-self:center}
.stamp svg{width:100%;height:auto;display:block;animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── огоньки + подписка ── */
.fire{position:relative;min-height:clamp(340px,40vw,440px);padding-block:48px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(180deg,#2a2a2c 0%,#454547 50%,#6a6a6d 100%);color:#fff}
.fire canvas{position:absolute;inset:0;width:100%;height:100%}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}25%{transform:scale(.94,1.08) rotate(2deg)}50%{transform:scale(1.04,.94) rotate(-1deg)}75%{transform:scale(.97,1.1) rotate(2.5deg)}100%{transform:scale(1,1) rotate(-2.5deg)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 2.6s ease-in-out infinite alternate}
@keyframes halo{from{opacity:.4;transform:scale(.9)}to{opacity:.8;transform:scale(1.1)}}
.fire__in{position:relative;display:grid;justify-items:center;gap:28px;width:100%}
.emblem{display:grid;justify-items:center;padding:18px 40px 8px}
.emblem .oval{width:clamp(96px,9vw,136px);height:auto;color:#fff;overflow:visible}
.emblem .fire__title{margin-top:14px;text-transform:uppercase;letter-spacing:.34em;padding-left:.34em;font-size:clamp(17px,1.8vw,24px);color:#fff}
.fire__box{position:relative;display:grid;gap:14px;justify-items:center;text-align:center;padding:28px clamp(18px,3vw,36px);background:rgba(28,28,30,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,255,255,.18),8px 10px 37px rgba(0,0,20,.45);max-width:min(620px,calc(100% - 32px))}
.fire__muted{color:rgba(255,255,255,.72)}
.fire .input{height:42px;border-radius:999px;padding:0 20px 2px;background:#fff;color:#000;box-shadow:8px 10px 37px rgba(0,0,0,.35)}
.fire .pill{background:#fff;color:#000;box-shadow:8px 10px 37px rgba(0,0,0,.5)}
.fire .pill:hover{box-shadow:8px 10px 37px rgba(255,122,28,.6)}
.field{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.input{flex:1 1 220px;min-width:0;height:46px;border:0;background:var(--tile);padding:0 16px;box-shadow:inset 1px 2px 30px rgba(0,0,0,.08)}

/* ── плитки ── */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-block:40px 64px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
.tile{min-height:clamp(110px,13vw,175px);display:grid;place-items:center;text-align:center;padding:16px;background:var(--pill);color:var(--pill-fg);border:0;box-shadow:var(--sh);font-size:clamp(17px,1.5vw,21px);transition:color .35s,box-shadow .35s}
.tile:hover{color:var(--red);box-shadow:var(--sh-hot)}
.tile--blink{animation:blink 1s infinite}
.tile--blink:hover{animation-play-state:paused}
@keyframes blink{0%,50%{color:var(--red);box-shadow:var(--sh-hot)}51%,100%{color:var(--pill-fg);box-shadow:var(--sh)}}


/* ── роза над свечой месяца ── */
.rose{margin:6px auto 0;display:grid;justify-items:center}
.rose img{width:clamp(220px,25vw,360px);height:auto;display:block;transition:filter .5s,transform .5s}
.rose img:hover{filter:drop-shadow(8px 10px 26px rgba(227,33,24,.35));transform:rotate(-2deg)}
.big--first{margin-top:18px}
/* ── подвал короткий ── */
.foot.foot--min{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 40px;padding-block:22px 14px}
.foot--min .foot__logo{width:170px}
.foot.foot--min ul{display:flex;flex-wrap:wrap;gap:8px 32px}
.copy{padding-block:0 22px}
/* ── письма: без плашки ── */
.fire__title{margin-top:10px;text-transform:uppercase;letter-spacing:.3em;padding-left:.3em;font-size:clamp(18px,1.9vw,26px);color:#fff;text-align:center}
.fire__sub{color:rgba(255,255,255,.8);text-align:center;max-width:40ch;font-size:16px;margin-top:-14px}
.fire__in{padding-left:var(--pl);padding-right:var(--pr)}
.nl{position:relative;width:min(460px,100%)}
.nl .input{width:100%;height:50px;border-radius:999px;padding:0 64px 2px 22px;background:#fff;color:#000;border:0;box-shadow:8px 10px 37px rgba(0,0,0,.35);font-size:17px}
.nl__go{position:absolute;right:5px;top:5px;width:40px;height:40px;border-radius:50%;border:0;background:#000;color:#fff;font-size:20px;transition:box-shadow .35s,background .35s}
.nl__go:hover{background:var(--red);box-shadow:0 0 16px rgba(255,110,40,.6)}
/* ── в огне ── */
.vogne{padding-block:4px 40px}
.vogne .label{border-bottom:1px solid #000;color:#000}
.vogne .label .more{color:#000}
.strip3{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 2*28px)/3);gap:28px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:22px 6px;scrollbar-width:thin}
.strip3::-webkit-scrollbar{height:4px}.strip3::-webkit-scrollbar-thumb{background:#000}
.acard{display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;text-align:left;color:var(--fg)}
.acard__link{display:grid;gap:12px;text-align:left}
.acard__lead{font-size:16px;color:var(--muted)}
.acard__btn{align-self:flex-start;margin-top:auto}
.acard__lead{margin-bottom:6px}
.acard__img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;transition:box-shadow .45s,transform .45s}
.acard__link:hover .acard__img{box-shadow:var(--sh-hot);transform:translateY(-2px)}
.acard__title{font-family:var(--serif);font-weight:300;font-size:clamp(22px,2vw,28px);line-height:1.12}
.acard__link:hover .acard__title{text-decoration:underline 2px var(--red);text-underline-offset:.18em}
.acard__meta{font-size:15px;color:var(--muted)}
/* ── о заводике (как страница MoMu Museum) ── */
.mus{padding-block:44px 64px}
.mus__lab{display:flex;justify-content:center;align-items:center;gap:10px;font-size:17px;text-transform:uppercase}
.mus__lab::before{content:"";width:15px;height:15px;border-radius:50%;background:currentColor}
.mus__lead{font-family:var(--serif);font-weight:300;font-size:clamp(28px,3.4vw,50px);line-height:1.1;text-align:center;max-width:26ch;margin:16px auto 30px;text-wrap:balance}
.mus__body{display:grid;gap:1em;max-width:58ch;padding-block:26px 30px;font-size:18px}
.gal{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--pr) 6px var(--pl);scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{margin:0;flex:none;scroll-snap-align:start;display:grid;gap:8px}
.gal img{height:clamp(240px,30vw,430px);width:auto;max-width:none;display:block}
.gal figcaption{display:flex;gap:28px;font-size:14px}
.mus__more{padding-top:24px}
/* ── документы ── */
.doc{display:grid;gap:18px;padding-bottom:72px;max-width:66ch}
.fb{display:grid;gap:14px;max-width:560px}
.fb .input,.fb textarea{width:100%;border:0;background:var(--tile);box-shadow:inset 1px 2px 30px rgba(0,0,0,.08);font-size:17px}
.fb .input{height:50px;border-radius:999px;padding:0 20px 2px}
.fb textarea{min-height:140px;border-radius:24px;padding:16px 20px;resize:vertical}
/* ── подвал ── */
.foot{display:grid;gap:28px;padding-block:44px 28px;border-top:1px solid var(--line);font-size:17px}
@media (min-width:800px){.foot{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;justify-items:start}
.foot h4{margin:0 0 10px;font-weight:400;font-size:17px}
.foot__logo{width:min(100%,260px);color:var(--fg)}
.foot__logo svg{width:100%;height:auto;display:block}
.copy{padding-block:0 32px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ── меню ── */
.menu{position:fixed;inset:0;z-index:85;background:var(--bg);overflow:auto;padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.menu__grid{display:grid;gap:36px;padding-top:28px}
@media (min-width:800px){.menu__grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.menu__grid h4{margin:0 0 14px;font-weight:400;font-size:17px;display:flex;gap:10px;align-items:center;text-transform:uppercase}
.menu__grid h4::before{content:"";width:13px;height:13px;border-radius:50%;background:currentColor}
.menu__grid ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;justify-items:start}
.menu__grid button{font-size:clamp(24px,2.4vw,32px);line-height:1.2;text-align:left}

/* ── корзина ── */
.scrim{position:fixed;inset:0;z-index:95;background:rgba(10,8,6,.3);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.drawer{position:fixed;z-index:96;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);box-shadow:-8px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.drawer.on{transform:none}
.drawer__head{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.drawer__list{flex:1;overflow:auto;display:grid;align-content:start}
.ln{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;padding-block:16px;border-bottom:1px solid var(--line);align-items:start}
.ln img,.ln .ph{width:72px;height:72px;object-fit:cover}
.ln__name{font-family:var(--serif);font-weight:300;font-size:20px;line-height:1.15}
.qty{display:inline-flex;align-items:center;border-radius:999px;height:34px;margin-top:8px;box-shadow:var(--sh);background:var(--pill)}
.qty button{width:34px;height:34px;border:0;background:none;font-size:18px}
.qty span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.rm{color:var(--muted);font-size:14px;margin-top:8px}
.sum{display:grid;gap:8px;padding-top:16px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-size:22px;padding-top:6px}
.progress{height:4px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--flame)}
.btn-wide{width:100%;height:52px;font-size:18px;margin-top:14px}
.empty{padding:48px 0;display:grid;gap:18px;justify-items:start}

/* ── внутренние страницы ── */
.page{padding-top:20px}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:15px;color:var(--muted);padding-block:24px 6px}
.crumbs button{color:inherit}
.pdp{display:grid;gap:32px;padding-block:20px 40px}
@media (min-width:900px){.pdp{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px}}
.pdp__media{display:grid;place-items:center;padding-block:clamp(40px,8vw,120px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pdp__media>*{width:min(420px,80%);aspect-ratio:1;object-fit:cover}
.pdp__info{display:grid;gap:18px;align-content:start}
@media (min-width:900px){.pdp__info{position:sticky;top:130px}}
.pdp__title{font-family:var(--serif);font-weight:300;font-size:clamp(36px,4.2vw,60px);line-height:1.02}
.pdp__price{font-size:28px;font-variant-numeric:tabular-nums}
.wax{display:grid;gap:8px}
.wax__label{color:var(--muted);font-size:16px}
.buy{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.buy .qty{margin-top:0;height:44px}
.buy .qty button{height:44px;width:42px}
.buy .pill{height:44px;padding:0 28px 2px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;font-size:16px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding-block:16px;display:flex;justify-content:space-between;transition:color .3s,text-shadow .3s}
summary:hover{text-decoration:underline 2px var(--red);text-underline-offset:.18em}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1}
details[open] summary::after{content:"–"}
details>div{padding-bottom:18px;color:var(--muted);font-size:16px}
.chips{display:flex;gap:10px;flex-wrap:wrap;padding-block:6px}
.chip{height:38px;padding:0 18px 2px;border-radius:999px;border:0;background:var(--pill);box-shadow:var(--sh);font-size:16px;white-space:nowrap;transition:box-shadow .35s,color .35s}
.chip:hover{box-shadow:var(--sh-hot)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip sup{font-size:11px;margin-left:3px;opacity:.7}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:22px 14px}
.select{height:38px;border-radius:999px;border:0;background:var(--pill);box-shadow:var(--sh);padding:0 14px}
.checkout{display:grid;gap:40px;padding-block:24px 72px}
@media (min-width:900px){.checkout{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:64px}}
.form{display:grid;gap:24px}
.form fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
.form legend{display:flex;align-items:center;gap:10px;font-size:16px;text-transform:uppercase;padding:0 0 6px}
.form legend::before{content:"";width:12px;height:12px;border-radius:50%;background:currentColor}
.form .lbl{display:grid;gap:6px;font-size:15px}
.form .input{height:50px}
.form textarea{min-height:96px;padding:14px 16px;border:0;background:var(--tile);resize:vertical;box-shadow:inset 1px 2px 30px rgba(0,0,0,.08)}
.two{display:grid;gap:12px}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--pill);box-shadow:var(--sh);cursor:pointer;transition:box-shadow .35s}
.opt:has(input:checked){box-shadow:var(--sh-hot)}
.opt input{margin-top:5px;accent-color:var(--red)}
.opt b{font-weight:500}
.err{color:var(--red);font-size:15px}
.summary{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:4px;align-content:start}
@media (min-width:900px){.summary{position:sticky;top:130px}}
.note{font-size:14px;color:var(--muted)}
.article{display:grid;gap:28px;padding-block:20px 40px;justify-items:center;text-align:center}
.article__img{width:clamp(220px,26vw,360px);aspect-ratio:3/4;object-fit:cover}
.article .prose{font-family:var(--serif);font-weight:300;font-size:clamp(19px,1.6vw,22px);line-height:1.55;max-width:62ch;text-align:left}
.article .prose p+p{margin-top:1em}
.rows .row{display:grid;gap:12px;padding-block:22px;border-bottom:1px solid var(--line);width:100%;text-align:left}
@media (min-width:800px){.rows .row{grid-template-columns:200px minmax(0,1fr) 180px;align-items:center;gap:36px}}
.row__img{width:120px;aspect-ratio:1;object-fit:cover}
@media (min-width:800px){.row__img{width:200px}}
.row__title{font-size:clamp(22px,2.3vw,32px);line-height:1.15}
.ok{display:grid;gap:20px;justify-items:center;text-align:center;padding-block:72px}
.toast{position:fixed;z-index:99;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.prose-sm{max-width:62ch}
.prose-sm p+p{margin-top:1em}


.logo .ls{display:none}
/* ── телефон: как мобильная версия MoMu — одна колонка, крупный текст, много воздуха ── */
@media (max-width:759px){
  body{font-size:19px;line-height:1.35}
  .marquee__track{font-size:20px;gap:64px;padding-left:64px}
  .head{padding-top:20px;min-height:64px}
  .logo{width:auto}
  .logo .lw{display:none}
  .logo .ls{display:block;width:84px}
  .logo .ls svg{width:100%;height:auto;display:block}
  .head{min-height:104px}
  .pills{top:calc(env(safe-area-inset-top,0px) + var(--mq) + 16px);gap:8px}
  .pill{height:42px;padding:0 18px 2px;font-size:19px}
  .pill .count{min-width:26px;height:26px;font-size:14px}
  .label{font-size:19px;padding-block:22px 18px;white-space:nowrap}
  .label::before{width:16px;height:16px}
  .label .more{font-size:17px}
  /* слайдер */
  .hero{display:grid;padding-bottom:40px}
  .counter{display:none}
  .slide__img{width:min(50vw,210px);margin-top:20px}
  .slide__title{font-size:clamp(34px,10vw,44px);margin-top:22px;line-height:1.02}
  .slide__btn{margin-top:-16px;height:44px;font-size:19px;padding:0 22px 2px}
  .slide__meta{font-size:19px;margin-top:20px;padding-inline:4px}
  .dots{margin-top:26px;gap:10px}
  .dots button{width:14px;height:14px;border:0;background:#f6c9c2}
  .dots button[aria-current="true"]{background:var(--red)}
  .big{margin-block:28px 6px;font-size:clamp(38px,11.5vw,54px);padding:.14em .3em .2em}
  .big small{font-size:15px}
  /* ячейки: одна колонка */
  .cells--3,.cells--p{grid-template-columns:1fr}
  .cells--3 .cell,.cells--p .cell,.cells--p .cell:nth-child(odd),.cells--p .cell:nth-child(even){padding:20px var(--pr) 0 var(--pl);border-right:0;border-bottom:1px solid var(--line)}
  .cells--3 .cell:last-child,.cells--p .cell:last-child{border-bottom:0}
  .cell__title,.cells--p .cell__title{font-size:20px;text-wrap:balance}
  .cell__meta{font-size:19px}
  .cell__media,.cells--p .cell__media{width:min(52vw,210px);margin:64px auto 52px}
  .cell__buy,.cells--p .cell__buy{flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;margin-top:8px}
  .cell__buy .pill,.cells--p .cell__buy .pill{height:38px;font-size:16px;padding:0 16px 2px}
  .tagline{position:static;margin-top:8px}
  /* каталог */
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--pl)*-1) calc(var(--pr)*-1);padding:8px var(--pr) 18px var(--pl)}
  .chips::-webkit-scrollbar{display:none}
  .chip{height:40px;padding:0 16px 2px;font-size:17px;flex:none}
  .toolbar{padding-block:6px 14px}
  .display{font-size:clamp(38px,11vw,50px)}
  /* разделы */
  .feature{padding-block:36px 56px;gap:24px}
  .feature__img{width:min(56vw,240px)}
  .feature__text{max-width:none}
  .feature__title{font-size:30px}
  .stamp{width:min(60vw,240px)}
  .fire{padding-block:40px}
  .fire__box{padding:24px 18px;width:calc(100% - 32px)}
  .fire__box .field{flex-direction:column}
  .fire__box .input,.fire__box .pill{width:100%;height:50px;flex:none}
  .fire__box .pill{font-size:19px}
  .tiles{grid-template-columns:1fr;gap:14px;padding-block:28px 48px}
  .tile{min-height:128px;font-size:20px}
  .foot{gap:28px;padding-block:36px 24px;font-size:19px}
  .foot ul{gap:8px}
  .foot__logo{width:min(70vw,260px)}
  .pdp{gap:24px}
  .pdp__media{padding-block:40px}
  .pdp__media>*{width:min(62vw,260px)}
  .pdp__title{font-size:36px}
  .facts{font-size:17px}
  .menu__grid{gap:30px;padding-top:24px}
  .menu__grid h4{font-size:17px}
  .menu__grid button{font-size:26px}
  .article .prose{font-size:19px}
  .rows .row{gap:14px}
  .row__img{width:min(52vw,210px);justify-self:center;margin-block:12px}
  .row__title{font-size:24px}
  .crumbs{font-size:15px}
  .strip3{grid-auto-columns:82%;gap:18px}
  .rose img{width:min(64vw,260px)}
  .foot.foot--min{flex-direction:column;align-items:flex-start;gap:14px;padding-block:22px 12px}
  .foot.foot--min ul{flex-direction:column;gap:8px}
  .vogne{padding-block:2px 26px}
  .mus{padding-block:32px 48px}
  .mus__lead{font-size:30px}
  .mus__body{font-size:19px}
  .gal{gap:16px}
  .gal img{height:280px}
  .fire__sub{margin-top:-10px}
  .tiles{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ───────── корзина ───────── */
function cartLines(ctrl=true){
  const items=Object.entries(cart).filter(([id])=>byId(id));
  if(!items.length) return `<div class="empty"><p class="h3 serif">В корзине пока пусто</p><button class="pill" data-go="catalog">В каталог</button></div>`;
  return items.map(([id,q])=>{const p=byId(id);return `<div class="ln">${media(p)}
    <div><div class="ln__name">${p.name}</div><div class="muted small">${p.size}${hasWax(p)?" · "+WAX[waxOf(id)].toLowerCase()+" воск":""}</div>
    ${ctrl?`<div class="qty"><button data-cq="${id}" data-d="-1" aria-label="Меньше">−</button><span>${q}</span><button data-cq="${id}" data-d="1" aria-label="Больше">+</button></div><br><button class="bare tl rm" data-rm="${id}">Удалить</button>`:`<div class="muted small">${q} шт.</div>`}</div>
    <span class="price">${rub(p.price*q)}</span></div>`}).join("");
}
function sumBlock(cta=true){
  const t=totals(); if(!t.sub) return "";
  const left=FREE-t.sub;
  return `<div class="sum">
   ${left>0?`<span class="small muted">До бесплатной доставки ${rub(left)}</span><div class="progress"><i style="width:${Math.min(100,t.sub/FREE*100)}%"></i></div>`:`<span class="small" style="color:var(--ok)">Доставка бесплатно</span>`}
   <div><span class="muted">Товары</span><span>${rub(t.sub)}</span></div>
   <div><span class="muted">Доставка</span><span>${t.ship?rub(t.ship):"0 ₽"}</span></div>
   <div class="total"><span>Итого</span><span>${rub(t.total)}</span></div>
   ${cta?`<button class="pill pill--hot btn-wide" data-go="checkout">Оформить заказ</button>`:""}</div>`;
}
function renderCart(){
  $("#cartCount").textContent=Object.values(cart).reduce((a,b)=>a+b,0);
  $("#cartList").innerHTML=cartLines(); $("#cartSum").innerHTML=sumBlock();
}
function add(id,q=1,wax="olive"){const p=byId(id);const k=hasWax(p)?id+"~"+wax:id;cart[k]=(cart[k]||0)+q;save();renderCart();toast(`${p.name}${hasWax(p)?", "+WAX[wax].toLowerCase()+" воск":""} — в корзине`)}
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1800)}
function openCart(on){const d=$("#drawer"),s=$("#scrim");
  if(on){d.hidden=s.hidden=false;requestAnimationFrame(()=>{d.classList.add("on");s.classList.add("on")})}
  else if(!d.hidden){d.classList.remove("on");s.classList.remove("on");setTimeout(()=>{d.hidden=s.hidden=true},300)}}

/* ───────── слайдер ───────── */
function showSlide(i){
  const s=[...document.querySelectorAll(".slide")]; if(!s.length)return;
  slide=(i+s.length)%s.length;
  s.forEach((el,k)=>{el.classList.toggle("on",k===slide);el.toggleAttribute("aria-hidden",k!==slide);el.querySelectorAll("button").forEach(b=>b.tabIndex=k===slide?0:-1)});
  document.querySelectorAll(".dots button").forEach((d,k)=>d.setAttribute("aria-current",k===slide));
  $("#slideNo").textContent=`${slide+1}/${s.length}`;
}
function startSlides(){clearInterval(slideTimer);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  slideTimer=setInterval(()=>{if(!document.hidden&&!$(".hero:hover"))showSlide(slide+1)},6000)}

/* ───────── логотип: черный → оранжевый → красный ───────── */
function heatLogo(el){
  if(el.dataset.heat)return; el.dataset.heat=1;
  const css=()=>getComputedStyle(document.documentElement);
  let anim;
  el.addEventListener("mouseenter",()=>{const c=css();const from=getComputedStyle(el).color;anim&&anim.cancel();
    anim=el.animate([{color:from},{color:c.getPropertyValue("--orange").trim()},{color:c.getPropertyValue("--red").trim()}],{duration:900,easing:"ease-in-out",fill:"forwards"})});
  el.addEventListener("mouseleave",()=>{const c=css();const from=getComputedStyle(el).color;anim&&anim.cancel();
    anim=el.animate([{color:from},{color:c.getPropertyValue("--orange").trim()},{color:c.getPropertyValue("--fg").trim()}],{duration:900,easing:"ease-in-out",fill:"forwards"});
    anim.onfinish=()=>{anim.cancel();anim=null}});
}

/* ───────── навигация ───────── */
let view="home";
function hashFor(v,data={}){
  if(v==="home")return "#/";
  if(v==="catalog"){let h="#/catalog";const c=data.col||F.col,ty=data.type||F.type;if(c&&c!=="all")h+="/col/"+c;if(ty&&ty!=="all")h+="/type/"+ty;return h}
  if((v==="product"||v==="article")&&(data.id||cur.id))return "#/"+v+"/"+(data.id||cur.id);
  return "#/"+v;
}
function parseHash(){
  const parts=(location.hash||"").replace(/^#\/?/,"").split("/").filter(Boolean);
  let v=parts[0]||"home";if(!V[v]||v==="ok")v="home";
  const data={};
  if(v==="catalog"){for(let i=1;i<parts.length;i+=2)data[parts[i]]=parts[i+1]}
  if(v==="product"||v==="article"){data.id=parts[1];if(v==="product"&&!byId(data.id))return {v:"catalog",data:{}};if(v==="article"&&!ARTICLES.some(a=>a.id===data.id))return {v:"journal",data:{}}}
  return {v,data};
}
function go(v,data={},push=true){
  if(v==="catalog")F={col:data.col||"all",type:data.type||"all",sort:"def"};
  if(data.id)cur.id=data.id;
  if(v==="product")cur.wax="olive";
  view=v; $("#app").innerHTML=V[v](); $("#menu").hidden=true; openCart(false);
  window.scrollTo({top:0,behavior:"instant"});
  document.querySelectorAll(".logo").forEach(heatLogo);
  if(v==="home"){const r=$("#roseImg");if(r)r.src=TEX.rose}
  clearInterval(slideTimer);
  if(push){const h=hashFor(v,data);try{if(location.hash!==h)history.pushState({v},"",h)}catch(e){}}
}
window.addEventListener("popstate",()=>{const r=parseHash();go(r.v,r.data,false)});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-go]"); if(!t)return;
  if(t.dataset.go){e.preventDefault();go(t.dataset.go,{...t.dataset});return}
  if(t.dataset.add){add(t.dataset.add);return}
  if(t.dataset.addq){add(t.dataset.addq,+$("#pq").textContent,cur.wax||"olive");return}
  if(t.dataset.wax){cur.wax=t.dataset.wax;document.querySelectorAll("[data-wax]").forEach(b=>b.setAttribute("aria-pressed",b===t));const p=byId(cur.id);$("#pmat").textContent=matFor(p,cur.wax);return}
  if(t.dataset.q){const s=$("#pq");s.textContent=Math.max(1,+s.textContent+ +t.dataset.q);return}
  if(t.dataset.cq){const id=t.dataset.cq;cart[id]=Math.max(0,(cart[id]||0)+ +t.dataset.d);if(!cart[id])delete cart[id];save();renderCart();return}
  if(t.dataset.rm){delete cart[t.dataset.rm];save();renderCart();return}
  if(t.dataset.f){F[t.dataset.f]=t.dataset.v;try{history.replaceState({v:"catalog"},"",hashFor("catalog",{}))}catch(e){}$("#app").innerHTML=V.catalog();document.querySelectorAll(".logo").forEach(heatLogo);return}
  if(t.dataset.slide){showSlide(+t.dataset.slide);startSlides();return}

(function fire(){
  const cv=$("#fireCanvas"), ctx=cv.getContext("2d"); let W=0,H=0,dpr=1,flames=[];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const spr=[0,1,2,3,4,5].map(i=>{const im=new Image();im.src=TEX["fl"+i];return im});
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
    flames=[];const gx=Math.max(54,W/22),gy=70;let r=0;
    for(let y=gy*.75;y<H+gy;y+=gy,r++)for(let x=(r%2?gx/2:0)-gx;x<W+gx;x+=gx)
      flames.push({x,y,s:.7+Math.random()*.55,ph:Math.random()*6.28,sp:.8+Math.random()*1.4,i:Math.floor(Math.random()*6)})}
  function flame(f,t,x){
    const k=f.s*(1+.09*Math.sin(t*f.sp*3.1+f.ph)+.05*Math.sin(t*f.sp*7.3+f.ph*2));
    const sway=Math.sin(t*f.sp*1.7+f.ph)*.07, h=40*k, w=26*f.s, y=f.y;
    ctx.globalCompositeOperation="lighter";
    const g=ctx.createRadialGradient(x,y-h*.4,0,x,y-h*.4,h*1.2);
    g.addColorStop(0,"rgba(255,120,40,.16)");g.addColorStop(1,"rgba(255,70,20,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y-h*.4,h*1.2,0,6.29);ctx.fill();
    ctx.globalCompositeOperation="source-over";
    const im=spr[f.i]; if(!im.complete)return;
    ctx.save();ctx.translate(x,y);ctx.rotate(sway);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore();
  }
  let hole=null;function measure(){const e=document.querySelector('.fire__in'),s=cv.getBoundingClientRect();if(!e)return;const r=e.getBoundingClientRect();hole={x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2,rx:Math.min(r.width,520)/2+40,ry:r.height/2+30}}
  function draw(ms){const t=reduce?0:ms/1000;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    flames.forEach(f=>{const x=((f.x+t*14)%(W+120))-60;if(hole){const dx=(x-hole.x)/hole.rx,dy=(f.y-18-hole.y)/hole.ry;if(dx*dx+dy*dy<1)return}flame(f,t,x)});
    if(!reduce)requestAnimationFrame(draw)}
  size();measure();addEventListener("resize",()=>{size();measure()});requestAnimationFrame(draw);
})();
